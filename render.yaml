# Render's free PostgreSQL database expires 30 days after creation. For a
# permanent setup, create a Neon database and set DB_URL/DB_USER/DB_PASSWORD in
# the Render dashboard. See docs/HOSTING.md.
databases:
  - name: dentcare-db
    plan: free
    databaseName: dentcare

services:
  - type: web
    name: carebydent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Optional free-tier keep-alive. It uses roughly 730 of the workspace's
      # 750 monthly free hours, so enable it only if DentCare is the only free
      # service in this workspace (or accept the shared-quota risk).
      # - key: APP_KEEPALIVE_ENABLED
      #   value: "true"
      - key: DB_HOST
        fromDatabase:
          name: dentcare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dentcare-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dentcare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dentcare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dentcare-db
          property: password