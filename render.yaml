databases:
  - name: dentcare-db
    plan: free
    databaseName: dentcare

services:
  - type: web
    name: dentcare
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: dentcare-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dentcare-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: dentcare-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: dentcare-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dentcare-db
          property: password