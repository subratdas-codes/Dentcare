spring.application.name=dentcare
server.port=${PORT:8080}

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinic_db?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}

# SMTP for password reset + contact notifications.
# Gmail SMTP (smtp.gmail.com) is NOT reachable from Render (blocked at TCP level).
# Use a provider Render can reach - default is SendGrid (smtp.sendgrid.net).
#   SendGrid: MAIL_USERNAME=apikey, MAIL_PASSWORD=<SG.xxx API key>
#   Brevo:    SMTP_HOST=smtp-relay.brevo.com, MAIL_USERNAME=<your login email>, MAIL_PASSWORD=<SMTP key>
# Leave MAIL_USERNAME empty to skip sending and log messages instead (dev mode).
spring.mail.host=${SMTP_HOST:smtp.sendgrid.net}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Public base URL used to build password-reset links (override with APP_URL on Render)
app.reset-link-base=${APP_URL:http://localhost:8080}

# Don't let the Actuator health endpoint (used by Render) fail when SMTP creds are unset
management.health.mail.enabled=false