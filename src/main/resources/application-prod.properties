# Production profile (PostgreSQL).
# DB_URL wins, so an external database such as Neon or Supabase can be used
# without changing anything else. DB_HOST/DB_PORT/DB_NAME remain as a fallback
# for the existing Render-managed database.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require}
spring.datasource.username=${DB_USER:${DB_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# A small pool keeps the JVM within a 512 MB free instance and is well below
# Neon's free connection limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}