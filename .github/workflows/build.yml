name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: dentcare-jar
          path: target/dentcare.jar

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dentcare:ci .

      - name: Smoke test image
        run: |
          docker run -d --name dentcare-test -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=local dentcare:ci
          sleep 20
          curl -fs http://localhost:8080/actuator/health | grep -q UP
          docker stop dentcare-test