name: Keep DentCare Awake

# Render's free web-service plan spins the app down after 15 minutes without
# traffic. These pings keep a request arriving well inside that window so the
# site stays warm for visitors.
#
# Note: this is a free-plan workaround. A paid Render instance type is the
# only guaranteed always-on option.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dentcare-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the live health endpoint
        shell: bash
        run: |
          url="https://carebydent.onrender.com/actuator/health"
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: ${url}"
            code=$(curl -sS -o /tmp/dentcare-health.json -w '%{http_code}' --max-time 180 "${url}" || true)
            echo "HTTP ${code}"
            if [ "${code}" = "200" ] && grep -q '"status":"UP"' /tmp/dentcare-health.json; then
              echo "DentCare is awake and healthy."
              exit 0
            fi
            sleep 20
          done
          echo "DentCare did not become healthy in time."
          exit 1
